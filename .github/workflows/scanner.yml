name: Yuewei Premier League Bot Scanner

on:
  schedule:
    # 突发新闻扫描：每 15 分钟一次（UTC，全天候）
    - cron: '*/15 * * * *'
    # 每日早报：UTC 22:00 = 北京时间次日 06:00
    - cron: '0 22 * * *'
  workflow_dispatch:        # 支持在 GitHub 后台手动触发，可选运行模式
    inputs:
      mode:
        description: '运行模式（scan=突发扫描 / morning=早报汇总）'
        required: true
        default: 'scan'
        type: choice
        options:
          - scan
          - morning

# 回写 state.json 需要写权限，否则 git push 会静默失败 → 去重失效 → 每 15 分钟重复推送同一条
permissions:
  contents: write

# 早报与扫描可能同时触发（22:00 恰好也是 */15 的整点），串行化避免 state.json 写冲突
concurrency:
  group: ${{ github.workflow }}-state
  cancel-in-progress: false

jobs:
  # ==================== 突发新闻扫描（每 15 分钟） ====================
  scan:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'scan')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir requests google-genai

      - name: Run bot.py (Scan Mode)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: "scan"
        run: python bot.py

      - name: Commit state changes (if any)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add state.json || true
          git commit -m "Auto-update bot state.json [skip ci]" || true
          git pull --rebase || true
          git push || true

  # ==================== 每日早报（北京时间 06:00） ====================
  morning:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 22 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'morning')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir requests google-genai

      - name: Run bot.py (Morning Mode)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: "morning"   # 明确指定为早报模式
        run: python bot.py

      - name: Commit state changes (if any)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add state.json || true
          git commit -m "Auto-update bot state.json [skip ci]" || true
          git pull --rebase || true
          git push || true
