name: Yuewei News Scanner

concurrency:
  group: yuewei-news-scanner-lock
  cancel-in-progress: false

on:
  schedule:
    - cron: '*/15 * * * *' # 常规高频扫描
    - cron: '0 22 * * *'   # 每日早报 (UTC 22:00 = 北京时间早 06:00)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (scan or morning)'
        required: false
        default: 'scan'
        type: choice
        options:
          - scan
          - morning

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine Run Mode
        id: set-mode
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            echo "RUN_MODE=scan" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.mode }}" != "" ]; then
            echo "RUN_MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
          else
            echo "RUN_MODE=scan" >> $GITHUB_ENV
          fi

      - name: Run Bot Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: ${{ env.RUN_MODE }}
        run: python bot.py

      - name: Commit and Push State Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add state.json run_telemetry.log || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update bot state and telemetry [skip ci]" && git push)
