name: Yuewei Premier League Bot Scanner

on:
  schedule:
    # ⚠️ 突发扫描已改为由 cron-job.org 外部调度（workflow_dispatch）。
    #    原因：GitHub 自带 schedule 高峰期会延迟 5~15 分钟甚至跳过，不可靠。
    #
    #    【2026-10-31 实测更正，见 docs/reports/AUDIT_SCHEDULER_5_4.md】
    #    · cron-job.org 实际是「每 5 分钟」一次，不是早期注释写的 10 分钟。
    #      88 个 dispatch 样本间隔中位 5.00 分钟、最大 5.35、零丢拍。
    #    · 本仓库实际是 **public**（API 实测 visibility=public），
    #      Actions 分钟数免费不限量。早期注释「private，仅 2000 分钟/月」
    #      是过期信息，不要再据此限制调度频率。
    #    · GitHub schedule 在这个仓库几乎不触发：全历史仅 7 条记录，
    #      且 '0 22 * * *' 的早报曾延迟 207 分钟（22:00Z 排期 → 01:27Z 才跑）。
    #      因此下面两条 cron 只能当「兜底」，不能当「准时」。
    #
    # 【三层调度冗余】详见 deploy/cloudflare-worker/README.md
    #   主：cron-job.org（每分钟）—— 唯一真正准时的
    #   备：Cloudflare Worker 外部看门狗（每分钟读 state.json，心跳断了就补触发）
    #   兜底：下面这条 GitHub schedule
    #   多重触发不会重复推送：concurrency 串行化 + state 去重。
    - cron: '*/5 * * * *'
    #
    # 【早报时间契约】必须与 bot.py 的 MORNING_TARGET_HOUR_CN = 6 严格对应：
    #     UTC 22:00 == 北京 次日 06:00（中国无夏令时，全年固定 UTC+8）
    #     '0 22 * * *'  →  每天北京 06:00
    #     tests/test_maintenance_v12.py 会解析本文件并断言这条对应关系，
    #     以后谁改 cron 却忘了改代码（或反过来）都会当场测试失败。
    - cron: '0 22 * * *'
    # 心跳看门狗：UTC 23:00 = 北京 07:00，此时早报应已发出，正好校验
    - cron: '0 23 * * *'
  workflow_dispatch:        # 支持在 GitHub 后台手动触发，可选运行模式
    inputs:
      mode:
        description: '运行模式（scan=突发扫描 / morning=早报汇总 / diagnose=诊断 / watchdog=心跳检查）'
        required: true
        default: 'scan'
        type: choice
        options:
          - scan
          - morning
          - diagnose
          - watchdog
      force:
        description: '强制补发早报：勾选后忽略「今日已发」日期锁（仅 morning 模式生效）'
        required: false
        default: false
        type: boolean

  # 【代码自检】push 到 main 时跑一次轻量校验：只查仓库卫生 + 跑测试，
  # 不抓取、不推送、不写 state.json。目的是让「提交了 pyc / 测试挂了」
  # 在 push 后一分钟内暴露，而不是等下一轮定时任务才发现。
  #
  # 只改文档（**.md）或只回写 state.json 的提交不触发：
  #   前者没必要，后者是机器人每轮都在做的事（而且 commit_state.sh 已带 [skip ci]），
  #   两条叠加可以保证自检只在「真的改了代码」时跑。
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'state.json'

# 默认只读；只有真正要回写 state.json 的 job 才临时提升为 write。
# 这样 diagnose / watchdog 这类只读任务拿不到写权限，泄露风险面更小。
permissions:
  contents: read

# 早报与扫描可能同时触发（22:00 恰好也是 cron-job.org 的整点），串行化避免 state.json 写冲突
concurrency:
  group: ${{ github.workflow }}-state
  cancel-in-progress: false

jobs:
  # ==================== 突发新闻扫描 ====================
  scan:
    # 注意这里用的是「不等于 morning」而不是「等于 scan」：
    # cron-job.org 若只发 workflow_dispatch 而没传 inputs.mode，mode 会是 null，
    # 用精确匹配会导致两个 job 全不跑、workflow 空转。这样写能保证「不带 mode 就跑 scan」。
    if: >-
      (github.event_name == 'schedule' && github.event.schedule != '0 22 * * *' && github.event.schedule != '0 23 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'morning' && github.event.inputs.mode != 'diagnose' && github.event.inputs.mode != 'watchdog')
    permissions:
      contents: write   # 仅本 job 需要回写 state.json
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: 'pip'          # 缓存 pip 依赖，命中后安装从 ~20s 降到 3~5s

      - name: Guard against committed caches
        run: bash scripts/check_no_cache.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          # 配合 setup-python 的 cache:'pip'，命中缓存后安装只需 3~5 秒；
          # 保留 timeout/retries 是为了防止 Installing collected packages 阶段卡死
          pip install --timeout 60 --retries 5 -r requirements.txt

      - name: Run bot.py (Scan Mode)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: "scan"
          # 模型策略：DeepSeek 唯一启用，Gemini 接口保留但关闭，OpenAI 未接入
          AI_PRIMARY_PROVIDER: "deepseek"
          AI_GEMINI_ENABLED: "false"
          AI_OPENAI_ENABLED: "false"
          # 可信单一来源白名单（逗号分隔域名）。留空 = 单一来源一律不自动推送。
          # 只有人工确认过的记者/机构域名才写进来；UNKNOWN 域名即使写了也不生效。
          TRUSTED_SINGLE_SOURCES: ${{ vars.TRUSTED_SINGLE_SOURCES }}
        run: python bot.py

      - name: Commit state changes (if any)
        # 关键 Git 操作失败必须让 Job 失败：不再用 || true 掩盖。
        # 即便上一步失败也要尝试回写（新闻池要保住），所以保留 always()。
        if: always()
        run: bash scripts/commit_state.sh state.json 3

  # ==================== 每日早报（北京时间 06:00） ====================
  morning:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 22 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'morning')
    permissions:
      contents: write   # 仅本 job 需要回写 state.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: 'pip'          # 缓存 pip 依赖，命中后安装从 ~20s 降到 3~5s

      - name: Guard against committed caches
        run: bash scripts/check_no_cache.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          # 配合 setup-python 的 cache:'pip'，命中缓存后安装只需 3~5 秒；
          # 保留 timeout/retries 是为了防止 Installing collected packages 阶段卡死
          pip install --timeout 60 --retries 5 -r requirements.txt

      - name: Run bot.py (Morning Mode)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: "morning"   # 明确指定为早报模式
          AI_PRIMARY_PROVIDER: "deepseek"
          AI_GEMINI_ENABLED: "false"
          AI_OPENAI_ENABLED: "false"
          TRUSTED_SINGLE_SOURCES: ${{ vars.TRUSTED_SINGLE_SOURCES }}
          # 手动勾选 force 时绕过日期锁；定时触发时该值为空 → 正常走锁
          FORCE_SUMMARY: ${{ github.event.inputs.force }}
        run: python bot.py

      - name: Commit state changes (if any)
        # 关键 Git 操作失败必须让 Job 失败：不再用 || true 掩盖。
        # 即便上一步失败也要尝试回写（新闻池要保住），所以保留 always()。
        if: always()
        run: bash scripts/commit_state.sh state.json 3

  # ==================== 心跳看门狗（北京时间 07:00） ====================
  # 独立于 bot.py 运行，只读 state.json 判断「扫描和早报是不是已经停了」。
  # 静默停摆（cron-job.org 挂了 / Secrets 过期 / 仓库归档）只有它能发现。
  watchdog:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 23 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'watchdog')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Run watchdog
        run: python scripts/watchdog.py

  # ==================== 手动诊断（只读，不推送、不改 state） ====================
  # 触发方式：Actions → Run workflow → mode 选 diagnose
  # 用途：长时间没收到推送时，一次性看清「抓取层 / 去重层 / 候选层」卡在哪
  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'diagnose'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: 'pip'          # 缓存 pip 依赖，命中后安装从 ~20s 降到 3~5s

      - name: Guard against committed caches
        run: bash scripts/check_no_cache.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          # 配合 setup-python 的 cache:'pip'，命中缓存后安装只需 3~5 秒；
          # 保留 timeout/retries 是为了防止 Installing collected packages 阶段卡死
          pip install --timeout 60 --retries 5 -r requirements.txt

      - name: Dump state.json
        run: |
          echo "=========== state.json ==========="
          if [ -f state.json ]; then cat state.json; else echo "state.json 不存在（从未成功推送过）"; fi
          echo "=================================="

      - name: Run diagnose.py
        run: python diagnose.py

      - name: Dump telemetry tail
        if: always()
        run: |
          echo "=========== run_telemetry.log (last 20) ==========="
          if [ -f run_telemetry.log ]; then tail -n 20 run_telemetry.log; else echo "无 telemetry 日志"; fi

  # ==================== 代码自检（push 到 main 触发） ====================
  # 只做两件事：仓库卫生守卫 + 快速测试。不碰网络、不碰 Telegram、不写 state.json，
  # 所以它拿只读权限就够了，也永远不会因为模型/网络问题变红。
  #
  # 注意：workflow 级的 concurrency 会把它和 scan/morning 串起来。
  # 这是有意为之——push 时多半正好有人刚跑过扫描，串行比并发安全；
  # 代价是极端情况下自检要等一轮扫描跑完（≤6 分钟）。
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Guard against committed caches
        run: bash scripts/check_no_cache.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install --timeout 60 --retries 5 -r requirements.txt

      - name: Run fast tests
        # --fast 跳过 test_git_commit（它要建真实 git 仓库，约 50s），其余全跑
        run: python tests/run_all.py --fast

      - name: Confirm source files are intact
        # 防「清理缓存时顺手把源码删了」这类事故：几个核心文件必须在
        run: |
          for f in bot.py ai_provider.py evidence.py schema.py state_store.py redact.py; do
            test -s "$f" || { echo "::error title=Source File Missing::$f 不存在或为空"; exit 1; }
          done
          echo "::notice title=Sources Intact::核心源码文件齐全"
