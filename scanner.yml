name: Yuewei Premier League Bot Scanner

on:
  schedule:
    - cron: '*/15 * * * *'  # 每 15 分钟自动触发一次
  workflow_dispatch:        # 支持在 GitHub 后台手动点击 "Run workflow" 触发测试

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir requests google-genai

      - name: Run bot.py (Scan Mode)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: "scan"
        run: python bot.py

      - name: Commit state changes (if any)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add state.json || true
          git commit -m "Auto-update bot state.json [skip ci]" || true
          git push || true
